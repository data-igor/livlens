name: Build areas.geojson

on:
  push:
    branches: [main]
    paths:
      - "data/areas.csv"
      - "data/boundaries/**"
  workflow_dispatch: {}

# Avoid two builds racing to commit at once.
concurrency:
  group: build-geojson
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build areas.geojson
        run: python3 scripts/build.py

      - name: Commit regenerated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/areas.geojson data/geo_cache.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: rebuild areas.geojson from areas.csv"
            git push
          fi
