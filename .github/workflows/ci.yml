name: CI

on:
  pull_request:
    branches: [dev]

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build areas.geojson (must not crash, must trace all boundaries)
        run: python3 scripts/build.py

      - name: Syntax-check docs/app.js
        run: node --check docs/app.js
