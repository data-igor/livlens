name: PR checks + sync to dev

# PRs target `main` and are always merged there manually by a human — this
# workflow never touches that PR. It only (1) runs a build/syntax check on
# every PR, and (2) merges the PR's branch straight into `dev` via a plain
# git merge, purely so `dev` always has a live, up-to-date preview. The PR
# itself is untouched: it stays open against `main` until someone merges it.

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build areas.geojson (must not crash, must trace all boundaries)
        run: python3 scripts/build.py

      - name: Syntax-check docs/app.js
        run: node --check docs/app.js

  sync-dev:
    needs: build-and-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: dev

      - name: Merge PR branch into dev (plain git merge, not a PR merge)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "${{ github.event.pull_request.head.sha }}"
          git merge --no-ff "${{ github.event.pull_request.head.sha }}" \
            -m "sync: merge PR #${{ github.event.pull_request.number }} branch into dev for preview"
          git push origin dev
